apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-scoring-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scoring-engine
  template:
    metadata:
      labels:
        app: scoring-engine
    spec:
      containers:
      - name: api
        image: sentinel-scoring:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-scoring-service
spec:
  type: NodePort
  selector:
    app: scoring-engine
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080